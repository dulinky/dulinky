<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ | Thế giới của bạn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop-name">Thế giới của bạn</div>
    
    <div id="auth-section" style="margin-bottom: 20px; text-align: right;"></div>
    <hr>
    
    <h2>Danh mục Sản phẩm</h2>
    <div id="categories" style="margin-bottom: 30px;"></div>

    <h2>Danh sách Sản phẩm</h2>
    <div id="products" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        const authDiv = document.getElementById('auth-section');
        
        if (user) {
            let adminLink = user.role === 'admin' ? ` | <a href="admin/products/index.html">Vào Admin</a>` : '';
            authDiv.innerHTML = `Xin chào, <b style="color:#00f0ff">${user.username}</b> | <button onclick="logout()">Đăng xuất</button> | <a href="cart.html">🛒 Giỏ hàng</a>${adminLink}`;
        } else {
            authDiv.innerHTML = `<a href="login.html">Đăng nhập</a> | <a href="register.html">Đăng ký</a>`;
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            location.reload();
        }

        function loadCategories() {
            fetch('http://localhost:3000/posts')
                .then(res => res.json())
                .then(categories => {
                    let html = `<button onclick="loadProducts()" style="margin-right: 10px;">Tất cả</button>`;
                    html += categories.map(c => `
                        <button onclick="loadProducts('${c.id}')" style="margin-right: 10px;">${c.name}</button>
                    `).join('');
                    document.getElementById('categories').innerHTML = html;
                });
        }

        function loadProducts(categoryId = null) {
            fetch('http://localhost:3000/products')
                .then(res => res.json())
                .then(data => {
                    if (categoryId) data = data.filter(p => p.categoryId == categoryId);
                    if (data.length === 0) {
                        document.getElementById('products').innerHTML = `<p style="color: gray;">Không có sản phẩm nào.</p>`;
                        return;
                    }
                    let html = data.map(p => `
                        <div class="product-card">
                            <img src="${p.image}" alt="${p.name}">
                            <h3>${p.name}</h3>
                            <p class="price">${p.price.toLocaleString()} VNĐ</p>
                            <div>
                                <a href="detail.html?id=${p.id}" style="margin-right: 10px;">Chi tiết</a>
                                <button onclick="addToCart('${p.id}', '${p.name}', ${p.price})">Mua ngay</button>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('products').innerHTML = html;
                });
        }

        function addToCart(id, name, price) {
            if (!user || user.role === 'admin') return alert('Vui lòng đăng nhập bằng tài khoản Khách hàng!');
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let item = cart.find(c => c.id === id);
            if (item) item.quantity += 1;
            else cart.push({ id, name, price, quantity: 1 });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Đã thêm vào giỏ hàng!');
        }

        loadCategories();
        loadProducts();
    </script>
</body>
</html>
